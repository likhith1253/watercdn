# E2: goal change (G1: required pressure 25 m, G2: energy weight x2); sources from the E1 library.
extends: [configs/e1.yaml]
experiment: E2
scenarios:
  table: data/scenarios/e2_scenarios.csv
  pairs: data/scenarios/e2_pairs.csv
  manifest: data/scenarios/e2_manifest.json
shift:
  kind: goal
  library_table: data/scenarios/e1_scenarios.csv
  targets_per_group: 40
  calibration_share: 0.5     # E2: half of each goal's targets recalibrate lambda; E3: all targets are test
  id_start: 2000
pairs:
  per_distance_tertile: 2
  repeats: 8
  test_repeats: 8
frozen_gate: results/e1/models/gate_M5.joblib
reuse_library_from: results/e1/jobs
results_dir: results/e2
